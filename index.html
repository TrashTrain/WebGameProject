<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WebGameProject</title>

  <!--
    A template that fills whatever box it is given.

    Unity's Default template pins the canvas to a fixed 960x600 and adds a
    "unity-desktop" class that keeps it there. That is fine on a page of its own
    and wrong everywhere else: dropped into an embed smaller than 960x600 — a
    game portal's iframe, say — the canvas overflows, the browser puts scrollbars
    around it, and the top of the HUD is simply cut off. The game looked broken
    while being perfectly fine.

    Here the canvas is sized by CSS to 100% of the viewport. Unity keeps its
    render target matched to the canvas's DOM size by default
    (config.matchWebGLToCanvasSize), so the game re-renders at whatever size the
    frame actually is, and follows it when that changes.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* No scrollbars: the canvas is always exactly the viewport, so a
         scrollbar can only mean something has gone wrong. */
      overflow: hidden;
      background: #12182B;
    }

    #unity-container {
      position: absolute;
      inset: 0;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #12182B;
      /* The game reads drags itself. Without this, a touch drag scrolls or
         zooms the page instead of moving a block. */
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    #unity-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #E8C46A;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #12182B;
    }

    #unity-progress-track {
      width: 220px;
      height: 6px;
      background: #1E2742;
      border-radius: 3px;
      overflow: hidden;
    }

    #unity-progress-fill {
      width: 0%;
      height: 100%;
      background: #E8C46A;
      transition: width 0.15s linear;
    }

    /* Errors sit over the game, because a silent failure is worse than an
       ugly one. Warnings go to the console instead — the usual one here is
       about compressed files served without Content-Encoding, which is
       expected on a static host and which decompressionFallback handles. */
    #unity-error {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      padding: 10px;
      background: #D94F4F;
      color: #fff;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: none;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">
      <div>WebGameProject</div>
      <div id="unity-progress-track"><div id="unity-progress-fill"></div></div>
    </div>
    <div id="unity-error"></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var progress = document.querySelector("#unity-progress-fill");
    var errorBox = document.querySelector("#unity-error");

    function showBanner(message, type) {
      if (type === "error") {
        errorBox.style.display = "block";
        errorBox.textContent = message;
      } else {
        console.warn("[unity] " + message);
      }
    }

    var buildUrl = "Build";

    // Every build's files are requested under a new URL.
    //
    // Unity names its output the same thing every time, so a static host's CDN
    // happily keeps serving yesterday's copies. That is not a cosmetic problem:
    // a fresh index.html paired with a cached data file fails with
    // "Cannot read properties of undefined (reading 'subarray')" and a blank
    // canvas, because the loader is handed bytes from a different build.
    //
    // BuildScript rewrites the stamp below on every build, so each publish asks
    // for URLs nobody has cached — including people who already loaded the old
    // one. The files on disk keep their normal names.
    var v = "?v=20261118182351";

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb" + v,
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb" + v,
      codeUrl: buildUrl + "/WebGL.wasm.unityweb" + v,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "WebGameProject",
      productVersion: "1.0",
      showBanner: showBanner,
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js" + v;
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        progress.style.width = (100 * p) + "%";
      }).then(function () {
        loading.style.display = "none";
      }).catch(function (message) {
        showBanner(message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
